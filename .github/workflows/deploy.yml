name: Deploy

on:
  push:
    branches: [main]
    # Skip deploys when a push only touches docs or dev-only files. Root `*.md`
    # only: apps/web/prompts/*.md ship with the app.
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".out-of-scope/**"
      - "infra/README.md"
      - "compose.dev.yml"
      - "scripts/dev.mjs"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing image SHA tag to deploy (for rollback)"
        required: false
        default: ""

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  build-images:
    needs: checks
    if: ${{ inputs.tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        run: echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the PC images when their code changed, on a manual run, or when
      # :latest is missing from GHCR (e.g. an earlier build never got that far).
      - id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="all"
          else
            # Diff the whole push, not just its last commit
            CHANGED=$(git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null || echo "all")
          fi
          missing() { ! docker manifest inspect "ghcr.io/miconen/$1:latest" >/dev/null 2>&1; }
          companion=false; transcriber=false
          echo "$CHANGED" | grep -qE '^(apps/companion/|packages/shared/|all)' && companion=true
          echo "$CHANGED" | grep -qE '^(apps/companion/transcriber/|all)' && transcriber=true
          missing geo-coach-companion && companion=true
          missing geo-coach-transcriber && transcriber=true
          echo "companion=$companion" >> "$GITHUB_OUTPUT"
          echo "transcriber=$transcriber" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/miconen/geo-coach-web:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/miconen/geo-coach-web:main

      - name: Build & push companion image
        if: steps.changes.outputs.companion == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/companion/Dockerfile
          push: true
          tags: |
            ghcr.io/miconen/geo-coach-companion:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/miconen/geo-coach-companion:latest

      - name: Build & push transcriber image
        if: steps.changes.outputs.transcriber == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/companion/transcriber
          file: apps/companion/transcriber/Dockerfile
          push: true
          tags: |
            ghcr.io/miconen/geo-coach-transcriber:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/miconen/geo-coach-transcriber:latest

  deploy:
    needs: [checks, build-images]
    if: always() && needs.checks.result == 'success' && (inputs.tag != '' || needs.build-images.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy compose and Caddyfile
        run: |
          scp infra/compose.prod.yml deploy@${{ secrets.VPS_HOST }}:/srv/geo-coach/compose.yml
          scp infra/Caddyfile deploy@${{ secrets.VPS_HOST }}:/srv/geo-coach/Caddyfile

      - name: Write secrets, dump DB, migrate, and start
        env:
          IMAGE_TAG: ${{ inputs.tag || needs.build-images.outputs.sha_tag }}
          DOMAIN: ${{ secrets.DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
        run: |
          ssh deploy@${{ secrets.VPS_HOST }} bash -s <<EOF
          set -euo pipefail
          cd /srv/geo-coach

          umask 077
          cat >.env <<ENVEOF
          IMAGE_TAG=${IMAGE_TAG}
          DOMAIN=${DOMAIN}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
          DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
          ENVEOF
          chmod 600 .env

          mkdir -p certs dumps
          cat >certs/origin.pem <<'CERTEOF'
          ${CF_ORIGIN_CERT}
          CERTEOF
          cat >certs/origin.key <<'KEYEOF'
          ${CF_ORIGIN_KEY}
          KEYEOF
          chmod 600 certs/origin.key

          if docker compose ps --status running --services | grep -q '^postgres$'; then
            STAMP=\$(date -u +%Y%m%dT%H%M%SZ)
            docker compose exec -T postgres pg_dump -U geocoach geocoach </dev/null | gzip > "dumps/pre-\${STAMP}.sql.gz"
            ls -1t dumps/pre-*.sql.gz | tail -n +6 | xargs -r rm -f
          fi

          docker compose pull web migrate postgres caddy
          docker compose up -d postgres
          # </dev/null: the rest of this script arrives on stdin, so compose must not read it
          docker compose run --rm -T migrate </dev/null
          docker compose up -d web caddy

          for i in \$(seq 1 30); do
            if curl -fsS "https://${DOMAIN}/healthz" >/dev/null 2>&1; then
              echo "Health check passed."
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after 60s." >&2
          exit 1
          EOF
