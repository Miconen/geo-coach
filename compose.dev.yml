services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: geocoach
      POSTGRES_PASSWORD: geocoach
      POSTGRES_DB: geocoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocoach -d geocoach"]
      interval: 5s
      timeout: 3s
      retries: 10

  transcriber:
    profiles: ["gpu"]
    build:
      context: ./apps/companion/transcriber
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      WHISPER_MODEL: large-v3
      WHISPER_COMPUTE_TYPE: int8_float16
    volumes:
      - whisper-cache-dev:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata-dev:
  whisper-cache-dev:
