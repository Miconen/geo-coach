services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: geocoach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: geocoach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocoach -d geocoach"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    image: ghcr.io/miconen/geo-coach-web:${IMAGE_TAG}
    restart: "no"
    environment:
      DATABASE_URL: postgres://geocoach:${POSTGRES_PASSWORD}@postgres:5432/geocoach
    # Re-derive Games and Rounds from their raw duels after migrating, so new
    # derived columns are filled on deploy. It updates rows in place.
    command:
      ["sh", "-c", "node apps/web/build-migrate.mjs && node apps/web/build-rebuild-derived.mjs"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/miconen/geo-coach-web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: https://${DOMAIN}
      DATABASE_URL: postgres://geocoach:${POSTGRES_PASSWORD}@postgres:5432/geocoach
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: https://${DOMAIN}/auth/discord/callback
      LATEST_COMPANION_VERSION: ${LATEST_COMPANION_VERSION:-0.1.0}
      PUBLIC_MAPBOX_TOKEN: ${PUBLIC_MAPBOX_TOKEN:-}
      PUBLIC_GOOGLE_MAPS_API_KEY: ${PUBLIC_GOOGLE_MAPS_API_KEY:-}
      SOURCE_IMAGES_DIR: /data/source-images
      # Room for add_source_image (a 2 MiB image is ~2.8 MB as base64) and long Sources
      BODY_SIZE_LIMIT: 4M
      PROCESSOR_SECRET: ${PROCESSOR_SECRET:-}
    # Images of knowledge bank Sources. Not in the database, so back it up too.
    volumes:
      - source-images:/data/source-images
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Runs Claude Code for the site's Fix button. It holds the Claude login, and only
  # reaches the app through /api/processor and a per-job /mcp token.
  processor:
    image: ghcr.io/miconen/geo-coach-web:${IMAGE_TAG}
    restart: unless-stopped
    command: ["node", "apps/web/build-processor.mjs"]
    init: true
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=700
      - /home/node:uid=1000,gid=1000,mode=700
    environment:
      HOME: /home/node
      WEB_URL: http://web:3000
      PROCESSOR_SECRET: ${PROCESSOR_SECRET:-}
      PROCESSOR_MODEL: ${PROCESSOR_MODEL:-claude-haiku-5-5}
      # Claim tagging jobs' model when the job names none (#94); empty uses PROCESSOR_MODEL.
      PROCESSOR_CLUE_TAG_MODEL: ${PROCESSOR_CLUE_TAG_MODEL:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    depends_on:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/origin.pem:/etc/caddy/certs/origin.pem:ro
      - ./certs/origin.key:/etc/caddy/certs/origin.key:ro
    depends_on:
      - web

volumes:
  pgdata:
  source-images:
